name: Build ESP-TamaCore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate embedded ROM
        shell: bash
        run: |
          set -euo pipefail
          test -f ps.bin
          size="$(stat -c%s ps.bin)"
          echo "ps.bin size: $size bytes"
          test "$size" -eq 8388608

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio==6.2.0"

      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Create full flash image
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/esp32-s3-devkitc-1"
          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"
          python "$ESPTOOL" --chip esp32s3 merge_bin             -o "$BUILD/esp-tamacore-full.bin"             --flash_mode qio             --flash_freq 80m             --flash_size 16MB             0x0 "$BUILD/bootloader.bin"             0x8000 "$BUILD/partitions.bin"             0x10000 "$BUILD/firmware.bin"

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp-tamacore-firmware
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-devkitc-1/esp-tamacore-full.bin
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
