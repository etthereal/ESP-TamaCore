[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Waveshare ESP32-S3-LCD-1.3: 16 MB flash + 8 MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=39
    -DTFT_DC=38
    -DTFT_RST=42
    -DTFT_BL=20
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -O3

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43


; Experimental Plus Color build: keep the ROM in the raw Flash partition and cache 64 KiB pages in PSRAM.
[env:pluscolor_flash]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTAMA_TARGET_PLUS_COLOR=1

; SD-backed P's build: put a raw 8 MiB P's dump at /ps.bin on the TF card.
[env:ps_sd]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTAMA_ROM_FROM_SD=1
    -DTAMA_SD_MOSI=11
    -DTAMA_SD_MISO=13
    -DTAMA_SD_SCK=12
    -DTAMA_SD_CS=10

; SD-backed 4U+ build: put a raw 8 MiB 4U+ dump at /4uplus.bin on the TF card.
[env:4uplus_sd]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTAMA_ROM_FROM_SD=1
    -DTAMA_TARGET_4U=1
    -DTAMA_SD_MOSI=11
    -DTAMA_SD_MISO=13
    -DTAMA_SD_SCK=12
    -DTAMA_SD_CS=10

; SD-backed original 4U build: put a raw 8 MiB 4U dump at /4u.bin on the TF card.
[env:4u_sd]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTAMA_ROM_FROM_SD=1
    -DTAMA_TARGET_4U_PLAIN=1
    -DTAMA_SD_MOSI=11
    -DTAMA_SD_MISO=13
    -DTAMA_SD_SCK=12
    -DTAMA_SD_CS=10
